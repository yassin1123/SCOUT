# ============================================================================
# SCOUT — interest profile
#
# This is the ONLY thing the ranking runs against, and the only thing sent
# to the API alongside item headlines: a list of topics. No identity, no
# personal data — none is needed and none should be added.
#
# Tiers steer the scoring: `high` beats `medium` beats `low`. Edit freely;
# adding or removing a line is the whole tuning mechanism.
# ============================================================================

interests:
  high:
    - "AI and machine learning: papers, model releases, industry news"
    - "edge / on-device AI: embedded inference, quantization, distillation, TensorRT-class tooling"
    - "multi-agent systems and agentic tooling"
    - "applied AI products and developer tooling"
    - "defence and dual-use technology"
    - "hardware-software integration, robotics, computer vision"
  medium:
    - "startups, venture funding and accelerators (UK and Europe)"
    - "hackathons, competitions, and AI/engineering roles worth applying to"
    - "AI and data regulation; UK policy that concretely touches tech, startups, funding or defence"
  low:
    - "financial markets and macro, where it intersects with tech"
