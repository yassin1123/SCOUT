# ============================================================================
# SCOUT — interest profile
#
# This is the ONLY thing the ranking runs against, and the only thing sent
# to the API alongside item headlines: a list of topics. No identity, no
# personal data — none is needed and none should be added.
#
# Tiers steer the scoring: `high` beats `medium` beats `low`. Edit freely;
# adding or removing a line is the whole tuning mechanism.
# ============================================================================

interests:
  high:
    - "startups: new companies, launches, notable new projects and products"
    - "venture capital and funding: new funds, startup rounds, accelerators, who's raising"
    - "technology and AI: major products, model releases, industry news"
    - "hackathons, competitions and tech/startup events worth attending —
       London/UK in-person or online; in-person outside the UK is rarely worth flagging"
    - "startup hiring: interesting roles at startups and AI companies"
  medium:
    - "financial markets and macro: rates, big market moves, major deals"
    - "UK politics: major government decisions and political developments,
       especially where they touch the economy, business, tech or startups"
  low:
    - "long-form ideas / self-improvement writing — occasional, weekly-digest material,
       never core news"
