# ============================================================================
# SCOUT — non-secret settings
#
# Secrets (API key, email app-password) live in .env — never here.
# Everything below is safe to commit and safe to edit.
# ============================================================================

# Documentation only — actual scheduling is via cron (see README).
run_times:
  morning: "07:00"
  evening: "18:00"
  weekly: "Sun 18:30"

timezone: "Europe/London"

# How many items each brief shows (deadline reminders don't count).
max_items_morning: 6
max_items_evening: 4

# Items scoring below this never make a brief.
min_score_to_show: 45

# On the first ever run there is no "last run" watermark — look back this far.
first_run_lookback_hours: 24

# Deadline reminders fire at these days-out marks (0 = "closes today" is
# always included). Reminders surface at the top of the morning brief.
deadline_reminder_days: [14, 7, 3, 1]

sources:
  arxiv:
    enabled: true
    categories: [cs.AI, cs.LG, cs.CL, cs.CV, cs.MA, cs.RO, cs.AR, cs.SY]
    daily_cap: 40          # max items sent to ranking per run
    max_results: 150       # how many recent submissions to pull from the API

  ft:
    enabled: true
    # Headlines + standfirsts ONLY — Scout never fetches article bodies.
    # You read the pieces in your own logged-in FT session.
    feeds:
      - "https://www.ft.com/technology?format=rss"
      - "https://www.ft.com/companies?format=rss"
      - "https://www.ft.com/markets?format=rss"

  ai_news:
    enabled: true
    # Tech / startup / VC news. Primary sources preferred over aggregators.
    # Anthropic has no official RSS feed as of writing — its careers board
    # is watched by the opportunities source instead.
    feeds:
      - "https://openai.com/news/rss.xml"
      - "https://deepmind.google/blog/rss.xml"
      - "https://huggingface.co/blog/feed.xml"
      - "https://jack-clark.net/feed/"        # Import AI (Jack Clark)
      - "https://techcrunch.com/feed/"        # startups, launches, funding rounds
      - "https://sifted.eu/feed"              # European startups & VC

  uk_politics:
    enabled: true
    feeds:
      - "https://feeds.bbci.co.uk/news/politics/rss.xml"
      - "https://www.theguardian.com/politics/rss"
    # Hard cap per brief — a mix of major UK politics and business-relevant
    # policy, never a politics newsletter.
    max_items: 3
    # Keyword gate: a politics story must hit one of these to even reach the
    # ranker. Covers business/tech policy AND major national developments;
    # pure personality/gossip pieces still get binned.
    keywords: [tech, technology, startup, start-up, AI, artificial intelligence,
               regulation, tax, budget, R&D, research, funding, investment,
               defence, defense, procurement, visa, immigration, skilled worker,
               data, digital, innovation, semiconductor, chips, economy,
               economic, spending, election, prime minister, chancellor,
               government, parliament, bill, law, NHS, energy, housing,
               interest rate, inflation, trade]

  opportunities:
    enabled: true
    # Best-effort by design — see README "Honest limits".
    # Hackathon/event/job listing feeds (RSS). Extend with any feed you trust.
    feeds:
      - "https://devpost.com/hackathons.rss"
      - "https://hnrss.org/jobs"              # YC startup job posts from Hacker News
    # Public Greenhouse job boards to watch (board token, not URL).
    greenhouse_boards: [anthropic]
    # A job title must hit one of these to be picked up.
    job_keywords: [forward deployed, applied ai, solutions engineer,
                   ai engineer, solutions architect]
    # Manual opportunities to track — surfaced once in a brief, then their
    # deadlines are tracked and reminded on. Dates are YYYY-MM-DD.
    manual: []
    #  - title: "Some hackathon"
    #    url: "https://example.org/hackathon"
    #    deadline: "2026-12-01"
    #    notes: "Submission deadline."

ranking:
  # Fast, cheap Claude model for scoring. Switch to a stronger model
  # (e.g. claude-sonnet-5) if you want sharper judgement — costs more.
  model: "claude-haiku-4-5"
  # One Anthropic call per week for the Sunday digest — worth a stronger
  # model. Falls back to `model` if unset.
  weekly_model: "claude-sonnet-5"
  batch_size: 10           # items scored per API call
  max_summary_chars: 1200  # truncate abstracts before sending to the API
  # Cheap keyword cut before any API spend. An arXiv item must hit one of
  # these in its title/abstract to reach the ranking stage.
  prefilter_keywords: [agent, agentic, LLM, edge, on-device, inference,
                       quantization, distillation, multi-agent, retrieval,
                       evaluation, deployment, robotics, embedded, vision,
                       RL, tool use, reasoning, fine-tune]
  # $/1M tokens for the run-cost estimate in the logs (claude-haiku-4-5).
  # Update if you change model.
  price_per_mtok_input: 1.00
  price_per_mtok_output: 5.00

# One good long-form read in the Sunday digest — never in the daily briefs.
weekly_reading:
  enabled: true
  feeds:
    - "https://fs.blog/feed/"          # Farnam Street
    - "https://jamesclear.com/feed"    # James Clear

mailer:
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
